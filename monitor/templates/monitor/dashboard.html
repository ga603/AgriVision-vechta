<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision Vechta - Crop Health Monitor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">AgriVision Münsterland</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <div class="card mb-3">
                <div class="card-header bg-dark text-white">Monitored Fields</div>
                <!-- Dynamic Django Sidebar List -->
                <ul class="list-group list-group-flush" id="field-list">
                    {% for field in fields %}
                    <li class="list-group-item">
                        <strong>{{ field.name }}</strong><br>
                        <small class="text-muted">Crop: {{ field.crop_type }}</small><br>
                        <button class="btn btn-sm btn-outline-success mt-2 w-100" onclick="analyzeField({{ field.id }})">
                            Run AI Analysis
                        </button>
                    </li>
                    {% empty %}
                    <li class="list-group-item text-muted">No fields loaded yet...</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-body p-2">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize the map centered on Vechta, Germany
    var map = L.map('map').setView([52.7278, 8.2831], 13);

    // Add OpenStreetMap base tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    // Create a dedicated layer for our stress heatmap
    var anomalyLayer = L.layerGroup().addTo(map);

    // 1. Load the pre-serialized JSON data directly from the Django backend
    var fieldData = {{ fields_json|safe }};

    // 2. Loop through the fields and draw them on the map
    fieldData.forEach(function(field) {
        var geojsonLayer = L.geoJSON(field.boundary, {
            style: {
                color: "#28a745", 
                weight: 3, 
                fillOpacity: 0.2
            }
        }).addTo(map);
        
        // Auto-center and zoom the map to fit the fields
        map.fitBounds(geojsonLayer.getBounds());
        
        geojsonLayer.bindPopup("<b>" + field.name + "</b><br>ID: " + field.id);
    });

    // 3. Define the function that calls our Python backend
   function analyzeField(fieldId) {
        let btn = event.target;
        let originalText = btn.innerHTML;
        btn.innerHTML = "Processing Copernicus Data...";
        btn.disabled = true;

        fetch('/analyze/' + fieldId + '/')
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    // Clear any previous anomaly scans
                    anomalyLayer.clearLayers();
                    
                    // Draw a red rectangle for each stressed 10x10m grid
                    data.heatmap.forEach(bounds => {
                        L.rectangle(bounds, {
                            color: "#ff0000", 
                            weight: 1, 
                            fillOpacity: 0.6
                        }).addTo(anomalyLayer);
                    });

                    alert("Analysis Complete!\n\nOverall NDVI: " + data.overall_ndvi + "\nStress Anomalies Flagged: " + data.stressed_clusters_count);
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
                alert("A network error occurred.");
            })
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
    }
</script>
</body>
</html>
